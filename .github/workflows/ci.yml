name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Python 3.10 is the declared minimum and the only version this repository
        # currently commits to testing and maintaining in CI.
        python-version: ["3.10"]

    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.7.22"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize locked development environment
        run: uv sync --locked --dev

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Validate package
        run: uv run python scripts/validate_package.py

      - name: Run tests
        run: uv run python -m pytest -q

      - name: Lint
        run: uv run ruff check .

      - name: Compile Python sources
        run: uv run python -m compileall -q jevloop scripts evals tests
