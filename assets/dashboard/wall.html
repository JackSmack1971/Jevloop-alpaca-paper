<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>jev-loop wall</title><style>html,body{height:100%;margin:0;background:#050607;color:#edf3f8;font-family:ui-monospace,Consolas,monospace}main{height:100%;display:grid;place-items:center;text-align:center}.big{font:700 clamp(50px,12vw,170px) system-ui;margin:0}.meta{font-size:clamp(15px,2vw,28px);color:#92a0ad}.run{color:#73d69b}.reduce{color:#e9ca70}.hold_late,.hold_blocked,.rules_only,.kill{color:#ff8989}</style></head><body><main><div><div id="rung" class="big">WAIT</div><div id="meta" class="meta">no tick yet</div></div></main><script>async function p(){try{const r=await fetch('/latest.json',{cache:'no-store'}),d=await r.json(),t=(d.ticks||[]).at(-1);if(t){const e=document.getElementById('rung');e.textContent=(t.rung||'—').toUpperCase();e.className='big '+(t.rung||'');document.getElementById('meta').textContent=`${d.symbol||'—'} · ${t.action||'—'} · ${t.model||'—'} · ${t.latency_ms==null?'—':Math.round(t.latency_ms)+' ms'}`}}catch{}setTimeout(p,1000)}p()</script></body></html>
