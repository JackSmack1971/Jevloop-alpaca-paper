<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>jev-loop dashboard</title>
<style>
:root{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color-scheme:dark;background:#0b0d10;color:#e8edf3}*{box-sizing:border-box}body{margin:0;padding:24px;max-width:1400px;margin:auto}.top{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}.top h1{font:600 28px system-ui;margin:0}.badge{border:1px solid #39414c;border-radius:999px;padding:4px 9px;color:#aab6c3}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:18px}.card{border:1px solid #242b33;border-radius:12px;background:#10141a;padding:16px}.price{font-size:36px}.muted{color:#8896a5}.ok{color:#77d49b}.warn{color:#f0c96b}.bad{color:#ff8a8a}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;border-bottom:1px solid #20262d;padding:7px 5px}th{color:#8896a5}.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.kv div{border-top:1px solid #20262d;padding-top:8px}.kv b{display:block;font-weight:400;color:#8896a5}.chart{height:220px;display:flex;align-items:flex-end;gap:2px;margin-top:15px}.bar{flex:1;min-width:2px;background:#6aa2ff;border-radius:2px 2px 0 0}@media(max-width:850px){.grid{grid-template-columns:1fr}}
</style></head><body>
<div class="top"><h1>jev-loop</h1><span class="badge" id="symbol">—</span><span class="badge" id="mode">waiting</span><span class="muted" id="updated">—</span></div>
<div class="grid"><section class="card"><div class="muted">latest mid</div><div class="price" id="mid">—</div><div class="kv"><div><b>action</b><span id="action">—</span></div><div><b>rung</b><span id="rung">—</span></div><div><b>direction</b><span id="direction">—</span></div><div><b>model</b><span id="model">—</span></div><div><b>latency</b><span id="latency">—</span></div><div><b>execution</b><span id="execution">—</span></div></div><div class="chart" id="chart"></div></section>
<section class="card"><div class="muted">recent ticks</div><table><thead><tr><th>#</th><th>mid</th><th>action</th><th>rung</th></tr></thead><tbody id="rows"></tbody></table></section></div>
<script>
const $=id=>document.getElementById(id);function esc(v){return String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(d){const t=(d.ticks||[]).at(-1);$('symbol').textContent=d.symbol||'—';$('updated').textContent=d.generated_at?new Date(d.generated_at*1000).toLocaleTimeString():'—';if(!t)return;$('mid').textContent=t.mid==null?'—':Number(t.mid).toLocaleString(undefined,{maximumFractionDigits:6});$('action').textContent=t.action||'—';$('rung').textContent=t.rung||'—';$('direction').textContent=t.direction||'—';$('model').textContent=t.model||'—';$('latency').textContent=t.latency_ms==null?'—':Math.round(t.latency_ms)+' ms';$('execution').textContent=t.execution||'—';$('mode').textContent=(d.stats&&d.stats.mode)||((t.route||'').toUpperCase()==='MOCK'?'simulation/mock':'paper/dry');const ticks=(d.ticks||[]).slice(-16).reverse();$('rows').innerHTML=ticks.map(x=>`<tr><td>${esc(x.tick)}</td><td>${esc(x.mid==null?'—':Number(x.mid).toFixed(4))}</td><td>${esc(x.action)}</td><td>${esc(x.rung)}</td></tr>`).join('');const px=(d.ticks||[]).map(x=>Number(x.mid)).filter(Number.isFinite);const lo=Math.min(...px),hi=Math.max(...px),span=Math.max(hi-lo,1e-9);$('chart').innerHTML=px.slice(-100).map(v=>`<i class=bar style="height:${10+90*(v-lo)/span}%"></i>`).join('')}
async function poll(){try{const r=await fetch('/latest.json',{cache:'no-store'});if(r.ok)render(await r.json())}catch{}setTimeout(poll,1000)}poll();
</script></body></html>
